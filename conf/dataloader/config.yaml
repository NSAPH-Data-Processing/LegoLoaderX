var_groups: [gridmet, pm25_ushap, aqdh, census, climate_types]
min_year: 2000
max_year: 2010
# covariate read root (XDataset root): holds idx2zcta.parquet + {var_group}/{var}/...
# normalization stats are an X-only concern; they live at this root as the single
# canonical summary_statistics.json (see legoloaderx.utils.SUMMARY_STATS_FILENAME).
data_dir: data/covars
normalize: false
verbose: true


hydra:
  run:
    dir: logs/dataloader/${now:%Y-%m-%d}/${now:%H-%M-%S}