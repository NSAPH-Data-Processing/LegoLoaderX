defaults:
  - _self_
  - var_group: gridmet
  - datapaths: datapaths_cannon

# this should be set directly by script
timestr: "20000101"
var: tmmx

spatial_res: zcta
temporal_res: daily

vg_name: ${hydra:runtime.choices.var_group}

# Input/output paths are fixed by the datapaths tree (see conf/datapaths): inputs
# live under ${datapaths.basefolder}/input, covariate outputs under
# ${datapaths.basefolder}/covars.

uniqid_nm: us_uniqueid__census
uniqid_dir: lego/geoboundaries/us_geoboundaries__census/

hydra:
  run:
    dir: logs/preprocessing/${now:%Y-%m-%d}/${now:%H-%M-%S}
