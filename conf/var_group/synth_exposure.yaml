var_group_name: synth_exposure
# The 5 SYNTHETIC environmental exposures (PM2.5 + 4 gridmet), generated by src/synthetic_exposure.py
# as treatment-assignment models with a known confounder dependence. Unlike other var_groups these are
# NOT preprocessed from a lego source (lego_nm/lego_dir are null); the .npy files are written directly
# to <covars_root>/synth_exposure/<var>/<var>__<year>.npy in the standard dense covar format.
vars: [PM25, tmmx, rmax, pr, vs]
descriptions:
  PM25: "Synthetic fine particulate matter (ug/m^3), the ERC target; T = f(confounders)+structure+noise."
  tmmx: "Synthetic max-temperature exposure (standardized); confounder-driven + spatial/temporal structure."
  rmax: "Synthetic max relative-humidity exposure (standardized); confounder-driven + structure."
  pr:   "Synthetic precipitation exposure (standardized); confounder-driven + structure."
  vs:   "Synthetic wind-speed exposure (standardized); confounder-driven + structure."
min_year: 2011
max_year: 2020
valid_normalize: true
min_spatial_res: zcta
min_temporal_res: daily
lego_nm: null      # generated, not read from a lego source
lego_dir: null
